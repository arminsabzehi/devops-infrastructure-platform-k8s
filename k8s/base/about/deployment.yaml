apiVersion: apps/v1
kind: Deployment
metadata: {name: about}
spec:
  replicas: 1
  selector: {matchLabels: {app: about}}
  template:
    metadata: {labels: {app: about}}
    spec:
      containers: [{name: about, image: novamarket/about:1.1.0, ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: about}
spec:
  selector: {app: about}
  ports: [{port: 80, targetPort: 80}]
