apiVersion: apps/v1
kind: Deployment
metadata: {name: account}
spec:
  replicas: 1
  selector: {matchLabels: {app: account}}
  template:
    metadata: {labels: {app: account}}
    spec:
      containers: [{name: account, image: novamarket/account:1.0.0, ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: account}
spec:
  selector: {app: account}
  ports: [{port: 80, targetPort: 80}]
