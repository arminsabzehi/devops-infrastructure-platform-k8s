apiVersion: apps/v1
kind: Deployment
metadata: {name: product}
spec:
  replicas: 1
  selector: {matchLabels: {app: product}}
  template:
    metadata: {labels: {app: product}}
    spec:
      containers:
        - name: product
          image: novamarket/product:1.0.0
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: product}
spec:
  selector: {app: product}
  ports: [{port: 80, targetPort: 80}]
