apiVersion: apps/v1
kind: Deployment
metadata: {name: notification}
spec:
  replicas: 1
  selector: {matchLabels: {app: notification}}
  template:
    metadata: {labels: {app: notification}}
    spec:
      containers:
        - name: notification
          image: novamarket/notification:1.1.0
          ports: [{containerPort: 3000}]
          env:
            - {name: PORT, value: "3000"}
            - {name: SERVICE_NAME, value: notification}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: postgres-secret, key: DATABASE_URL}}}
---
apiVersion: v1
kind: Service
metadata: {name: notification}
spec:
  selector: {app: notification}
  ports: [{port: 3000, targetPort: 3000}]
